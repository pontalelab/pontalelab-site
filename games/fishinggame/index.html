<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>あみあみうみ | Pontalelab</title>
  <meta name="description" content="あみで魚をすくって図鑑を集めよう。対象年齢の目安：3〜6歳。">
  <meta property="og:title" content="あみあみうみ | Pontalelab">
  <meta property="og:description" content="あみで魚をすくって図鑑を集めよう。対象年齢の目安：3〜6歳。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pontalelab.com/games/fishinggame/">
  <meta property="og:image" content="https://pontalelab.com/icons/icon-512.png">
  <script src="/js/analytics.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ホーム画面 -->
    <div id="screen-home" class="screen active"></div>

    <!-- ゲーム画面 -->
    <div id="screen-game" class="screen">
      <!-- game-wrap がアスペクト比を保ちながら画面にフィットする -->
      <div id="game-wrap">
        <canvas id="game-canvas"></canvas>
        <div id="game-hud">
          <div id="hud-top">
            <div id="hud-left">
              <span id="sea-level-badge" class="badge">🌊 Lv1</span>
              <div class="point-wrap">
                <span id="sea-point-text">0 pt</span>
                <div id="sea-point-bar-bg"><div id="sea-point-bar"></div></div>
              </div>
            </div>
            <div id="hud-center">
              <div id="timer-display">60</div>
            </div>
            <div id="hud-right">
              <div id="catch-feed"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- うみそうじ画面 -->
    <div id="screen-cleanup" class="screen">
      <a href="javascript:void(0)" id="cleanup-back" class="btn-back">← もどる</a>
      <div id="cleanup-wrap">
        <canvas id="cleanup-canvas"></canvas>
        <div id="cleanup-hud">
          <div id="cleanup-hud-top">
            <div id="cleanup-hud-left">
              <span id="cleanup-remaining-badge" class="badge">🗑️ のこり 20 こ</span>
              <span id="cleanup-stage-badge" class="badge">🌊 きたない うみ</span>
            </div>
            <div id="cleanup-timer-display">90</div>
          </div>
          <div id="cleanup-progress-bar-bg"><div id="cleanup-progress-bar"></div></div>
          <p id="cleanup-hint">ゴミも おさかなも タップして つかまえよう🎵</p>
          <p id="cleanup-combo-badge"></p>
        </div>
        <!-- ゴミ0個になった瞬間だけ出る、一時的なお祝いトースト（ゲームは止まらない） -->
        <div id="cleanup-clear-toast">🎉 うみが きれいに なったよ！</div>
      </div>
    </div>

    <!-- リザルト画面 -->
    <div id="screen-result" class="screen"></div>

    <!-- 図鑑画面 -->
    <div id="screen-book" class="screen"></div>

    <!-- メッセージボトル オーバーレイ -->
    <div id="overlay-message" class="overlay hidden">
      <div class="overlay-box">
        <div class="overlay-icon">🍾</div>
        <h2>海からのメッセージ</h2>
        <p id="overlay-message-text"></p>
        <button id="overlay-message-ok" class="btn-primary">わかった！</button>
      </div>
    </div>

    <!-- レベルアップ オーバーレイ -->
    <div id="overlay-levelup" class="overlay hidden">
      <div class="overlay-box">
        <div class="overlay-icon" id="levelup-icon">🌊</div>
        <h2>海がきれいになった！</h2>
        <p id="levelup-name"></p>
        <button id="levelup-ok" class="btn-primary">やった！</button>
      </div>
    </div>

    <!-- うみそうじ：じかんです オーバーレイ -->
    <div id="overlay-cleanup-timeup" class="overlay hidden">
      <div class="overlay-box">
        <div class="overlay-icon">⏰</div>
        <h2>じかんですよ！</h2>
        <p id="cleanup-timeup-summary"></p>
        <button id="cleanup-timeup-replay" class="btn-secondary">🔄 もういちど あそぶ</button>
        <button id="cleanup-timeup-home"   class="btn-primary">🏠 ホームへ</button>
      </div>
    </div>

  </div>

  <!-- スマホを縦持ちしたときに表示する「横にしてね」オーバーレイ。CSSのみで判定・表示するのでJS不要 -->
  <div id="orientation-lock-overlay" aria-hidden="true">
    <div class="rotate-icon">📱</div>
    <p>スマホを よこに して あそんでね！</p>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
