    color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;

  /* 写真の上に薄いベールをかけて文字やボタンを読みやすくする */
  body::before{
    content:"";
    position:fixed;
    top:0; right:0; bottom:0; left:0;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.25) 70%, rgba(255,255,255,0.55) 100%);
    pointer-events:none;
    z-index:0;
  }
  h1,.sub,.stage,.toolbar,.status,.legend{ position:relative; z-index:1; }
  h1{
    font-size:22px;
    letter-spacing:0.06em;
    margin:0 0 4px;
    font-weight:700;
    color:var(--leaf-dark);
    text-shadow:0 1px 0 rgba(255,255,255,0.6);
  }
  .sub{
    color:var(--ink-soft);
    font-size:12.5px;
    margin-bottom:22px;
    letter-spacing:0.02em;
  }
  .stage{
    position:relative;
    width:min(640px, 92vw);
    aspect-ratio:16/10;
    background:
      radial-gradient(ellipse at 25% 15%, rgba(255,250,220,0.9), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(160,210,140,0.5), transparent 60%),
      var(--paper);
    border-radius:22px;
    border:3px solid var(--bark);
    box-shadow:0 18px 40px rgba(60,80,30,0.25), inset 0 0 0 1px rgba(255,255,255,0.4);
    overflow:hidden;
    perspective:1400px;
  }
  @keyframes stage-shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-7px); }
    40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(3px); }
  }
  .stage.shake{ animation:stage-shake 0.35s ease; }
  .page-flip{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    border-radius:22px;
    transition: transform 0.5s ease-in, opacity 0.42s ease-in;

  canvas{
    display:block;

  .toolbar{
    display:flex;
    gap:14px;

  }
  button{
    font-family:inherit;
    border:1.5px solid var(--thread);
    background:var(--paper);

    padding:16px 22px;
    min-height:52px;
    border-radius:18px;

    display:flex;
    align-items:center;
    gap:9px;

    transition:transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;

  button:hover{ transform:translateY(-1px); border-color:var(--leaf-dark); }
  button:active{
    transform:scale(0.9);
    box-shadow:0 1px 0 rgba(90,120,50,0.15);
  }
  @keyframes btn-pop{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.14); }
    100%{ transform:scale(1); }
  }
  button.active{
    background:linear-gradient(135deg, var(--sun), var(--coral));
    color:#3c2210;
    border-color:transparent;
    font-weight:700;
    animation:btn-pop .28s ease;
  }
  button.primary{
    background:var(--ok);
    color:#f4fbe8;
    border-color:transparent;
    font-weight:700;
  }
  button.primary.playing{

  .icon{ font-size:20px; }
  .status{
    margin-top:14px;
    font-size:12.5px;
    color:var(--ink-soft);
    min-height:18px;
    text-align:center;
  }
  .legend{
    margin-top:22px;
    width:min(640px,92vw);
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));

  .legend div{

  }
  .legend b{ color:var(--leaf-dark); font-weight:700;}

  /* --- 画面切り替え（ページがふわっと変わる演出。3D回転やfixedは使わない安全な方式） --- */
  .screen-stack{
    position:relative;
    width:100%;
  }
  .screen{
    display:none;
    flex-direction:column;
    align-items:center;
    width:100%;
    padding:28px 16px 60px;
    box-sizing:border-box;
    opacity:1;
    transform:scale(1) translateY(0);
    transition:opacity 0.22s ease, transform 0.22s ease;
  }
  .screen.visible{ display:flex; }
  .screen.page-out{
    opacity:0;
    transform:scale(0.96) translateY(10px);
  }
  .screen.page-in{
    opacity:0;
    transform:scale(0.97) translateY(-8px);
  }

  /* --- タイトル画面 --- */
  .book-cover{
    margin-top:8vh;
    background:rgba(255,255,255,0.55);
    border:3px solid var(--bark);
    border-radius:26px;
    padding:40px 32px;

  }

    font-size:14px;
    padding:12px 18px;
    min-height:44px;
    border-radius:14px;
  }

  /* --- テンプレート選択画面 --- */
  .template-list{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:min(420px,88vw);
    margin:18px 0 22px;
  }

    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
    text-align:left;
    background:rgba(255,255,255,0.6);

  }
  .template-card:hover{ border-color:var(--leaf-dark); }

  /* --- ゲーム画面 --- */

  }
</style>

<body>

<div class="screen-stack">

<!-- ① タイトル画面 -->
<div class="screen" id="screen-title">
  <div class="book-cover">
    <div class="book-cover-emoji">🌿📖🐝</div>
    <h1>おとの えほん</h1>

    <button id="start-btn" class="primary big"><span class="icon">▶</span>はじめる</button>
    <div style="margin-top:18px;">
      <a href="../" style="color:var(--ink-soft);font-size:13px;font-weight:700;text-decoration:underline;">
        🎮 ゲームいちらんに もどる
      </a>
    </div>

</div>

<!-- ② テンプレート選択画面 -->
<!-- ② モード選択画面 -->
<div class="screen" id="screen-mode">
  <h1 style="font-size:18px;">どうやってあそぶ？</h1>
  <div class="template-list">
    <button class="template-card" id="pick-mode-saru">
      <span class="template-emoji">🐒</span>
      <span class="template-title">さるの ブランコ</span>

    </button>
    <button class="template-card" id="pick-mode-hachi">
      <span class="template-emoji">🐝</span>
      <span class="template-title">はちの ふえ</span>
      <span class="template-desc">さるは もう いるよ。はなを なぞって みよう</span>
    </button>
    <button class="template-card" id="pick-mode-free">
      <span class="template-emoji">✏️</span>
      <span class="template-title">じゆうに あそぶ</span>

    </button>
  </div>
  <button id="back-to-title-btn" class="ghost-btn">◀ もどる</button>
</div>

<!-- ③ 曲選択画面（さるのブランコ／はちのふえの時だけ表示） -->
<div class="screen" id="screen-song">
  <h1 style="font-size:18px;">きょくを えらぼう</h1>
  <div class="template-list">
    <button class="template-card" id="pick-song-bunbunbun">
      <span class="template-emoji">🐝</span>
      <span class="template-title">ぶんぶんぶん</span>
    </button>
    <button class="template-card" id="pick-song-shabondama">
      <span class="template-emoji">🫧</span>
      <span class="template-title">シャボンだま</span>
    </button>
  </div>
  <button id="back-to-mode-btn" class="ghost-btn">◀ もどる</button>
</div>

<!-- ④ ゲーム画面 -->
<div class="screen" id="screen-game">
  <div class="game-topbar">
    <button id="to-cover-btn" class="ghost-btn small"><span class="icon">📕</span>はじめに もどる</button>
  </div>

  <div class="page-nav">
    <button id="prev-page-btn" class="nav-btn">◀</button>
    <span id="page-indicator" class="page-indicator">1 / 2</span>
    <button id="next-page-btn" class="nav-btn">▶</button>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
  </div>

  <div class="toolbar">
    <button id="tool-pendulum" class="active"><span class="icon">🪀</span>ふりこ</button>
    <button id="tool-flute"><span class="icon">🎺</span>ふえ</button>
    <button id="tool-eraser"><span class="icon">🧽</span>けす</button>
    <button id="clear-btn"><span class="icon">🗑</span>ぜんぶけす</button>
    <button id="play-btn" class="primary"><span class="icon">▶</span>ならす</button>
  </div>

  <div class="status" id="status">ふりこが えらばれているよ。がめんを ゆびで なぞってみてね。</div>
</div>

</div>



<script>
(() => {
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const playBtn = document.getElementById('play-btn');
  const toolPendulumBtn = document.getElementById('tool-pendulum');
  const toolFluteBtn = document.getElementById('tool-flute');
  const toolEraserBtn = document.getElementById('tool-eraser');
  const clearBtn = document.getElementById('clear-btn');
  const prevPageBtn = document.getElementById('prev-page-btn');
  const nextPageBtn = document.getElementById('next-page-btn');
  const pageIndicatorEl = document.getElementById('page-indicator');
  const stageEl = document.querySelector('.stage');
  const screenTitle = document.getElementById('screen-title');
  const screenMode = document.getElementById('screen-mode');
  const screenSong = document.getElementById('screen-song');
  const screenGame = document.getElementById('screen-game');
  const startBtn = document.getElementById('start-btn');
  const pickModeSaruBtn = document.getElementById('pick-mode-saru');
  const pickModeHachiBtn = document.getElementById('pick-mode-hachi');
  const pickModeFreeBtn = document.getElementById('pick-mode-free');
  const pickSongBunbunbunBtn = document.getElementById('pick-song-bunbunbun');
  const pickSongShabondamaBtn = document.getElementById('pick-song-shabondama');
  const backToTitleBtn = document.getElementById('back-to-title-btn');
  const backToModeBtn = document.getElementById('back-to-mode-btn');
  const toCoverBtn = document.getElementById('to-cover-btn');

  let W = 0, H = 0, DPR = 1;
  function resize(){
    const rect = canvas.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1;
    canvas.width = rect.width * DPR;
    canvas.height = rect.height * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const oldW = W, oldH = H;
    W = rect.width; H = rect.height;
    // モバイルのアドレスバー表示/非表示などでキャンバスサイズが変わると、
    // 既に配置済みのオブジェクトの座標が古い幅・高さ基準のままになり、
    // 音のタイミング/音程(座標から計算)と見た目がズレてしまう。
    // 変化した比率で配置済み座標も追従させることで、音と見た目のズレを防ぐ。
    if(oldW > 0 && oldH > 0 && (oldW !== W || oldH !== H) && typeof pages !== 'undefined'){
      const sx = W / oldW, sy = H / oldH;
      pages.forEach(p => {
        p.objects.forEach(o => {
          o.x1 *= sx; o.x2 *= sx;
          o.y1 *= sy; o.y2 *= sy;
        });
      });
    }
    draw();
  }
  window.addEventListener('resize', resize);

  // --- 状態 ---
  let currentTool = 'pendulum'; // 'pendulum' | 'flute'
  let pages = [ { objects: [], guides: [], allGuides: [] }, { objects: [], guides: [], allGuides: [] } ]; // まず2ページで開始
  let currentPage = 0;
  let dragging = null; // {type, x1,y1, x2,y2}
  let playing = false;
  let playToken = 0; // 再生セッション識別用

  const BEATS = 4;
  const BEAT_DUR = 0.75; // 秒（80bpm相当。以前より遅く）
  const MEASURE_DUR = BEATS * BEAT_DUR; // 2.0秒
  const FLUTE_MIN_DUR = 0.08; // 発音時間の最小値（極端に短いドラッグ対策）
  const SNAP_PX = 28;

  function beatX(i){ return (W / BEATS) * (i + 0.5); } // 拍番号ラベル表示用（見た目を拍セルの中央に）
  function beatSnapX(i){ return (i / BEATS) * W; } // 実際の発音タイミング(ガイドと同じ座標系)に合わせたスナップ位置

  // --- ツール切替 ---
  function setTool(t){
    currentTool = t;
    toolPendulumBtn.classList.toggle('active', t === 'pendulum');
    toolFluteBtn.classList.toggle('active', t === 'flute');
    toolEraserBtn.classList.toggle('active', t === 'eraser');
    if(t === 'pendulum'){
      statusEl.textContent = 'ふりこだよ：ゆびで なぞって ながさを きめてね。';
    } else if(t === 'flute'){
      statusEl.textContent = 'ふえだよ：はじめから おわりまで なぞってね。';
    } else {
      statusEl.textContent = 'けすツール：けしたい おとを タップしてね。';
    }
  }
  toolPendulumBtn.onclick = () => setTool('pendulum');
  toolFluteBtn.onclick = () => setTool('flute');
  toolEraserBtn.onclick = () => setTool('eraser');

  // モードに応じてツールボタンの表示・選択中ツールを切り替える
  // 'saru'(さるのブランコ)=笛は配置済みなので振り子のみ、'hachi'(はちのふえ)=振り子は配置済みなので笛のみ
  function applyModeToolVisibility(mode){
    if(mode === 'saru'){
      toolPendulumBtn.style.display = '';
      toolFluteBtn.style.display = 'none';
      setTool('pendulum');
    } else if(mode === 'hachi'){
      toolPendulumBtn.style.display = 'none';
      toolFluteBtn.style.display = '';
      setTool('flute');
    } else {
      toolPendulumBtn.style.display = '';
      toolFluteBtn.style.display = '';
      setTool('pendulum');
    }
  }

  clearBtn.onclick = () => {
    const page = pages[currentPage];
    const toRemove = page.objects.filter(o => !o.preset);
    const toKeep = page.objects.filter(o => o.preset);
    disposeSynthsFor(toRemove);
    page.objects = toKeep;
    page.guides = page.allGuides.map(g => ({...g})); // なぞって消えたガイドも復活させる
    stopPlayback();
    draw();
    statusEl.textContent = page.allGuides.length
      ? `${currentPage+1}ページめを けしたよ。はなは また さいしょから なぞれるよ。`
      : `${currentPage+1}ページめを けしたよ。`;
  };

  // --- ページ送り（めくるアニメーション） ---
  let flipInProgress = false;
  function snapshotCanvas(){
    // 演出用なので原寸(高DPRだとかなり大きい)ではなく縮小した解像度でコピーし、負荷を減らす
    const scale = 0.5;
    const snap = document.createElement('canvas');
    snap.width = Math.max(1, Math.round(canvas.width * scale));
    snap.height = Math.max(1, Math.round(canvas.height * scale));
    snap.className = 'page-flip';
    snap.getContext('2d').drawImage(canvas, 0, 0, snap.width, snap.height);
    return snap;
  }
  function animateFlipAway(direction){
    if(flipInProgress) return; // 演出が重なって溜まっていくのを防ぐ
    flipInProgress = true;
    // direction: 1 = 次のページへ（左回りにめくれて去る）, -1 = 前のページへ
    const snap = snapshotCanvas();
    snap.style.transformOrigin = direction > 0 ? 'left center' : 'right center';
    snap.style.transform = 'rotateY(0deg)';
    snap.style.opacity = '1';
    stageEl.appendChild(snap);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        snap.style.transform = `rotateY(${direction > 0 ? -130 : 130}deg)`;
        snap.style.opacity = '0';
      });
    });
    setTimeout(() => { snap.remove(); flipInProgress = false; }, 520);
  }
  function updatePageIndicator(){
    let dots = '';
    for(let i = 0; i < pages.length; i++){
      dots += (i === currentPage) ? '●' : '○';
    }
    pageIndicatorEl.textContent = dots;
    prevPageBtn.disabled = playing || currentPage === 0;
    nextPageBtn.disabled = playing || currentPage === pages.length - 1;
  }
  function goToPage(newIndex){
    if(playing || newIndex < 0 || newIndex >= pages.length || newIndex === currentPage) return;
    const direction = newIndex > currentPage ? 1 : -1;
    animateFlipAway(direction);
    currentPage = newIndex;
    updatePageIndicator();
    draw();
  }
  prevPageBtn.onclick = () => goToPage(currentPage - 1);
  nextPageBtn.onclick = () => goToPage(currentPage + 1);

  // --- ポインタ操作 ---
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: cx, y: cy };
  }

  function nearestBeat(x){
    let best = 0, bestDist = Infinity;
    for(let i=0;i<BEATS;i++){
      const d = Math.abs(beatSnapX(i) - x);
      if(d < bestDist){ bestDist = d; best = i; }
    }
    return { beat: best, dist: bestDist };
  }

  // --- テンプレート（なぞって曲を作る） ---
  // 「ぶんぶんぶん」：アップロードされたMIDIファイルのメロディトラック（フルート音色, ch.1）から
  // 抽出した冒頭「ぶんぶんぶん はちがとぶ」部分。pos/durは拍(四分音符=1)単位。2ページ構成。
  const TEMPLATES = {
    bunbunbun: {
      label: 'ぶんぶんぶん',
      pages: [
        [ {pos:0,note:'G5',dur:0.97}, {pos:1,note:'F5',dur:0.97}, {pos:2,note:'E5',dur:1.47} ],
        [ {pos:0,note:'D5',dur:0.47}, {pos:0.5,note:'E5',dur:0.47}, {pos:1,note:'F5',dur:0.47}, {pos:1.5,note:'D5',dur:0.47}, {pos:2,note:'C5',dur:1.47} ],
      ]
    },
    shabondama: {
      label: 'シャボン玉',
      // MIDIメロディトラック(原調はG5〜C7と高いため1オクターブ下げて採譜)
      pages: [
        [ {pos:0,note:'G4',dur:0.47}, {pos:0.5,note:'C5',dur:0.47}, {pos:1,note:'C5',dur:0.47}, {pos:1.5,note:'D5',dur:0.47}, {pos:2,note:'E5',dur:0.47}, {pos:2.5,note:'G5',dur:0.47}, {pos:3,note:'G5',dur:0.97} ], // しゃぼんだまとんだ
        [ {pos:0,note:'A5',dur:0.47}, {pos:0.5,note:'F5',dur:0.47}, {pos:1,note:'C6',dur:0.47}, {pos:1.5,note:'A5',dur:0.47}, {pos:2,note:'G5',dur:0.47}, {pos:2.5,note:'A5',dur:0.47}, {pos:3,note:'G5',dur:0.97} ], // やねまでとんだ
      ]
    }
  };

  function guideShape(g){
    // 自由配置と全く同じ flutePitch(len) の計算式で狙った音程が出るよう、
    // ガイドの長さ自体を逆算する（テンプレートだけ特別扱いの音程を持たせない）。
    let idx = FLUTE_SCALE.indexOf(g.note);
    if(idx < 0) idx = 7; // 未知の音名は中央付近にフォールバック
    if(idx === FLUTE_SCALE.length - 1) idx -= 1; // 最高音は到達域が極端に狭く実用上難しいため隣接音で近似
    const maxLen = Math.max(W, H) * 0.6;
    const targetT = 1 - idx / (FLUTE_SCALE.length - 1);
    const targetLen = Math.max(16, targetT * maxLen);
    const durBeats = g.dur !== undefined ? g.dur : 0.8;
    let dx = Math.min((durBeats / BEATS) * W, targetLen * 0.45);
    dx = Math.max(0, Math.min(dx, targetLen - 1));
    const dy = Math.sqrt(Math.max(1, targetLen * targetLen - dx * dx));
    const x1 = (g.pos / BEATS) * W;
    const y1 = H * 0.12;
    return { x1, y1, x2: x1 + dx, y2: y1 + dy };
  }

  function findMatchingGuide(page, drag){
    const TOL = 30;
    return page.guides.find(g => {
      const s = guideShape(g);
      return Math.hypot(drag.x1 - s.x1, drag.y1 - s.y1) < TOL &&
             Math.hypot(drag.x2 - s.x2, drag.y2 - s.y2) < TOL;
    });
  }

  // 笛テンプレートを「実際に配置済みのオブジェクト」として組み立てる（さるのブランコ用）
  function buildFluteObjectsFromNotes(pageNotes){
    return pageNotes.map(n => {
      const s = guideShape(n);
      return { type:'flute', x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2, beat:null, preset:true };
    });
  }
  // 笛テンプレートを「なぞり用ガイド」として組み立てる（はちのふえ用）
  function buildFluteGuidesFromNotes(pageNotes){
    return pageNotes.map(n => ({ pos: n.pos, dur: n.dur, note: n.note }));
  }
  // デフォルトの振り子（はちのふえ用に最初からセットしておくリズム）
  function defaultPendulumObject(){
    const x1 = W * 0.5, y1 = H * 0.08;
    const x2 = W * 0.62, y2 = H * 0.43;
    return { type:'pendulum', x1, y1, x2, y2, preset:true };
  }

  function loadModeSaru(key){
    // さるのブランコ：笛の旋律はセット済み。振り子(さる)は自分で自由に配置する。
    const tpl = TEMPLATES[key];
    if(!tpl) return;
    stopPlayback();
    pages.forEach(p => disposeSynthsFor(p.objects));
    pages = tpl.pages.map(pageNotes => ({
      objects: buildFluteObjectsFromNotes(pageNotes),
      guides: [],
      allGuides: []
    }));
    currentPage = 0;
    updatePageIndicator();
    applyModeToolVisibility('saru');
    draw();
    statusEl.textContent = `🐒「${tpl.label}」の ふえは もう なるよ！さるを うごかしてみよう。`;
  }

  function loadModeHachi(key){
    // はちのふえ：振り子はセット済み。笛は薄いガイドをなぞって自分で完成させる。
    const tpl = TEMPLATES[key];
    if(!tpl) return;
    stopPlayback();
    pages.forEach(p => disposeSynthsFor(p.objects));
    pages = tpl.pages.map(pageNotes => ({
      objects: [ defaultPendulumObject() ],
      guides: buildFluteGuidesFromNotes(pageNotes),
      allGuides: buildFluteGuidesFromNotes(pageNotes)
    }));
    currentPage = 0;
    updatePageIndicator();
    applyModeToolVisibility('hachi');
    draw();
    statusEl.textContent = `🐝さるは もう いるよ！はなを なぞって「${tpl.label}」を つくろう。`;
  }

  function resetBlank(){
    stopPlayback();
    pages.forEach(p => disposeSynthsFor(p.objects));
    pages = [ { objects: [], guides: [], allGuides: [] }, { objects: [], guides: [], allGuides: [] } ];
    currentPage = 0;
    updatePageIndicator();
    applyModeToolVisibility('free');
    draw();
    statusEl.textContent = 'まっさらな ページから はじめるよ。ふりこや ふえを おいてみよう。';
  }

  // --- 画面切り替え（本のページをめくるような演出） ---
  const screens = { title: screenTitle, mode: screenMode, song: screenSong, game: screenGame };
  function showScreen(name, onShown){
    const incoming = screens[name];
    const outgoing = Object.values(screens).find(el => el.classList.contains('visible') && el !== incoming);

    if(!outgoing){
      // 最初の表示（前の画面がない）はそのまま出すだけでよい
      incoming.classList.add('visible');
      if(onShown) onShown();
      return;
    }

    // 今の画面を先にふわっと退場させ、消えてから次の画面をふわっと入場させる
    // （2つの画面が同時にレイアウト上へ存在しないようにして、崩れを防ぐ）
    outgoing.classList.add('page-out');
    setTimeout(() => {
      outgoing.classList.remove('visible', 'page-out');
      incoming.classList.add('visible', 'page-in');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          incoming.classList.remove('page-in');
        });
      });
      if(onShown) onShown(); // 画面が実際に表示された後に呼ぶ（resize()などが幅0で走らないように）
    }, 220);
  }

  showScreen('title'); // 表紙を最優先で表示（この後のコードで何か問題が起きても表示に影響しないよう早めに呼ぶ）

  // ゲーム画面に入る直前に resize() して正しい W/H を確定させてから、配置を組み立てる
  function enterGame(setupFn){
    showScreen('game', () => {
      resize();
      setupFn();
    });
  }

  let pendingMode = null; // 'saru' | 'hachi'

  startBtn.onclick = () => showScreen('mode');
  backToTitleBtn.onclick = () => showScreen('title');
  backToModeBtn.onclick = () => showScreen('mode');
  toCoverBtn.onclick = () => { stopPlayback(); showScreen('title'); };

  pickModeSaruBtn.onclick = () => { pendingMode = 'saru'; showScreen('song'); };
  pickModeHachiBtn.onclick = () => { pendingMode = 'hachi'; showScreen('song'); };
  pickModeFreeBtn.onclick = () => { pendingMode = null; enterGame(resetBlank); };

  function loadSong(key){
    if(pendingMode === 'saru') loadModeSaru(key);
    else if(pendingMode === 'hachi') loadModeHachi(key);
  }
  pickSongBunbunbunBtn.onclick = () => enterGame(() => loadSong('bunbunbun'));
  pickSongShabondamaBtn.onclick = () => enterGame(() => loadSong('shabondama'));


  // 点と線分の距離（消しゴムのヒット判定に使用）
  function pointSegDist(px, py, x1, y1, x2, y2){
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx*dx + dy*dy;
    let t = lenSq > 0 ? ((px - x1) * dx + (py - y1) * dy) / lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.hypot(px - cx, py - cy);
  }
  const ERASE_TOL = 32;
  // --- ちょっとした演出（ドラッグ中のリング・配置/消去時のポップ） ---
  let placeEffects = []; // {x,y,t0,color}
  let effectLoopRunning = false;
  function spawnEffect(x, y, color){
    placeEffects.push({ x, y, t0: performance.now(), color });
    if(!effectLoopRunning){
      effectLoopRunning = true;
      requestAnimationFrame(effectTick);
    }
  }
  function effectTick(){
    const now = performance.now();
    placeEffects = placeEffects.filter(e => now - e.t0 < 480);
    draw(playing ? (Tone.now() - playStartTone) % MEASURE_DUR : null);
    if(placeEffects.length > 0 || dragging){
      requestAnimationFrame(effectTick);
    } else {
      effectLoopRunning = false;
    }
  }
  function ensureEffectLoop(){
    if(!effectLoopRunning){
      effectLoopRunning = true;
      requestAnimationFrame(effectTick);
    }
  }

  function eraseAt(x, y){
    const page = pages[currentPage];
    let bestIdx = -1, bestDist = Infinity;
    page.objects.forEach((o, i) => {
      if(o.preset) return; // 最初からセットされているものは消せない
      const d = pointSegDist(x, y, o.x1, o.y1, o.x2, o.y2);
      if(d < bestDist){ bestDist = d; bestIdx = i; }
    });
    if(bestIdx >= 0 && bestDist < ERASE_TOL){
      const [removed] = page.objects.splice(bestIdx, 1);
      disposeSynthsFor([removed]);
      spawnEffect(x, y, 'rgba(150,150,150,0.9)');
      draw();
      statusEl.textContent = 'けしたよ。';
    } else {
      statusEl.textContent = 'けしたい おとの ちかくを タップしてね。';
    }
  }

  function onDown(e){
    e.preventDefault();
    const p = getPos(e);
    if(currentTool === 'eraser'){
      eraseAt(p.x, p.y);
      return;
    }
    let startX = p.x, startY = p.y, snappedBeat = null;
    if(currentTool === 'flute'){
      const nb = nearestBeat(p.x);
      if(nb.dist < SNAP_PX){
        startX = beatSnapX(nb.beat);
        snappedBeat = nb.beat;
      }
    }
    dragging = { type: currentTool, x1:startX, y1:startY, x2:startX, y2:startY, beat:snappedBeat };
    ensureEffectLoop(); // ドラッグ中、指を止めていてもリングが脈打つように
    draw();
  }
  function onMove(e){
    if(!dragging) return;
    e.preventDefault();
    const p = getPos(e);
    dragging.x2 = p.x;
    dragging.y2 = p.y;
    draw();
  }
  function onUp(e){
    if(!dragging) return;
    const dx = dragging.x2 - dragging.x1;
    const dy = dragging.y2 - dragging.y1;
    const len = Math.hypot(dx, dy);
    if(len > 12){
      const page = pages[currentPage];
      const guide = dragging.type === 'flute' ? findMatchingGuide(page, dragging) : null;
      if(guide){
        const s = guideShape(guide);
        page.objects.push({ type:'flute', x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2, beat:null });
        page.guides = page.guides.filter(g => g !== guide);
        spawnEffect(s.x2, s.y2, 'rgba(244,185,66,0.95)');
        statusEl.textContent = '🎶 なぞれました！';
      } else {
        page.objects.push({...dragging});
        spawnEffect(dragging.x2, dragging.y2, dragging.type === 'pendulum' ? 'rgba(201,127,30,0.9)' : 'rgba(226,112,79,0.9)');
        statusEl.textContent = dragging.type === 'pendulum'
          ? 'ふりこを おいたよ！'
          : 'ふえを おいたよ！';
      }
    } else if(len > 0){
      // 小さすぎて配置されなかった時の合図（揺れ＋やわらかい音）
      shakeStage();
      playDenySound();
      statusEl.textContent = 'もうすこし おおきく なぞってね。';
    }
    dragging = null;
    draw();
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('touchend', onUp);

  // --- 描画 ---

  function draw(elapsedSec){
    const isPlaying = typeof elapsedSec === 'number';
    ctx.clearRect(0,0,W,H);

    // 背景の拍グリッド
    ctx.save();
    ctx.strokeStyle = 'rgba(90,120,50,0.12)';
    ctx.lineWidth = 1;
    for(let i=1;i<BEATS;i++){
      const x = (W/BEATS)*i;
      ctx.beginPath();
      ctx.moveTo(x,0); ctx.lineTo(x,H);
      ctx.stroke();
    }
    // 拍番号
    ctx.fillStyle = 'rgba(90,120,50,0.35)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    for(let i=0;i<BEATS;i++){
      ctx.fillText(String(i+1), beatX(i), H - 8);
    }
    ctx.restore();

    // なぞり用ガイド（薄い花）※オブジェクトより先に描いて奥に配置
    pages[currentPage].guides.forEach(g => drawGuideFlute(g));

    pages[currentPage].objects.forEach(o => drawObject(o, false, isPlaying ? elapsedSec : null));
    if(dragging) drawObject(dragging, true, null);

    // ドラッグ中：始点にふわふわ脈打つリングを表示（掴んでいる感を出す）
    if(dragging){
      const pulse = (Math.sin(performance.now() / 180) + 1) / 2; // 0〜1
      ctx.save();
      ctx.globalAlpha = 0.25 + pulse * 0.35;
      ctx.strokeStyle = dragging.type === 'pendulum' ? '#c97f1e' : '#e2704f';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(dragging.x1, dragging.y1, 14 + pulse * 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 配置・消去したときの、じわっと広がって消えるポップエフェクト
    placeEffects.forEach(e => {
      const age = performance.now() - e.t0;
      const t = Math.min(1, age / 480);
      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 8 + t * 30, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });

    // 再生ヘッド（現在位置）※🍃を縦に並べたラインで表現
    if(isPlaying){
      const x = (elapsedSec / MEASURE_DUR) * W;
      ctx.save();
      ctx.shadowColor = 'rgba(230,150,20,0.5)';
      ctx.shadowBlur = 4;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '15px sans-serif';
      const leafGap = 20;
      const wobbleBase = performance.now() / 260;
      for(let ly = 6; ly < H; ly += leafGap){
        const wobble = Math.sin(wobbleBase + ly * 0.25) * 3;
        const rot = Math.sin(wobbleBase * 0.8 + ly * 0.3) * 0.35;
        ctx.save();
        ctx.translate(x + wobble, ly);
        ctx.rotate(rot);
        ctx.fillText('🍃', 0, 0);
        ctx.restore();
      }
      ctx.restore();
    }
  }

  function drawGuideFlute(g){
    const s = guideShape(g);
    ctx.save();
    ctx.strokeStyle = 'rgba(226,112,79,0.45)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.4;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '22px sans-serif';
    ctx.fillText('🌸', s.x1, s.y1);
    ctx.fillText('🌼', s.x2, s.y2);
    ctx.restore();
  }

  function drawObject(o, isDragging, elapsedSec){
    ctx.save();
    if(o.type === 'pendulum'){
      let ex2 = o.x2, ey2 = o.y2;
      let period = null;
      const dx0 = o.x2-o.x1, dy0 = o.y2-o.y1;
      const L = Math.hypot(dx0, dy0);
      // 鉛直（画面下向き = 重力方向）からの初期振れ角。始点=支点、終点(ドラッグ位置)=初期位置。
      // 見た目の動きを分かりやすくするため、実際の振れ角より少し大きめ(1.6倍)に増幅する。
      const SWING_AMP = 1.6;
      const MAX_THETA = Math.PI * 0.47; // ほぼ水平(85度)を超えて不自然にならないようクランプ
      const theta0Raw = Math.atan2(dx0, dy0);
      const theta0 = Math.max(-MAX_THETA, Math.min(MAX_THETA, theta0Raw * SWING_AMP));
      if(elapsedSec !== null){
        period = pendulumPeriod(L);
        const theta = theta0 * Math.cos((2*Math.PI*elapsedSec)/period);
        ex2 = o.x1 + L * Math.sin(theta);
        ey2 = o.y1 + L * Math.cos(theta);
      }
      let glow = 0;
      if(elapsedSec !== null && period !== null){
        // 鉛直通過(振れ角0)の瞬間 = period/4 + k*(period/2) に発光させる
        const half = period / 2;
        const eff = (((elapsedSec - period/4) % half) + half) % half;
        const distToTick = Math.min(eff, half - eff);
        const flashWindow = 0.08;
        if(distToTick < flashWindow){
          glow = 1 - (distToTick / flashWindow);
        }
      }
      ctx.strokeStyle = isDragging ? '#c97f1e' : '#8a5a3b';
      ctx.fillStyle = '#c97f1e';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(o.x1,o.y1);
      ctx.lineTo(ex2,ey2 - 12);
      ctx.stroke();
      // 支点
      ctx.beginPath();
      ctx.arc(o.x1,o.y1,4,0,Math.PI*2);
      ctx.fill();
      // おもり（🐒。鳴った瞬間に光って少し大きくなる）
      if(glow > 0){
        ctx.shadowColor = 'rgba(230,150,20,0.9)';
        ctx.shadowBlur = 16 * glow;
      }
      const fontSize = 26 + glow * 8;
      ctx.font = `${fontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.save();
      ctx.translate(ex2, ey2);
      ctx.scale(-1, 1); // 左右反転
      ctx.fillText('🐒', 0, 0);
      ctx.restore();
      ctx.shadowBlur = 0;
    } else {
      // 笛：始点=🌸、終点=🌼。鳴っている間 🐝 が始点上空から終点上空へ飛び、
      // 飛び終わったらそのページ（小節）が終わるまで終点に留まる。
      const { startTime: triggerTime, duration } = fluteTiming(o);
      let flyT = 0;   // 0=始点上空 〜 1=終点上空
      let active = false;
      if(elapsedSec !== null){
        const dt = elapsedSec - triggerTime;
        if(dt >= 0 && dt <= duration){
          flyT = dt / duration;
          active = true;
        } else if(dt > duration){
          flyT = 1; // 飛行完了後は終点に留まる（次の小節に入るまで戻らない）
        }
      }

      // ガイドの点線（花と花をつなぐ）
      ctx.strokeStyle = isDragging ? 'rgba(226,112,79,0.6)' : `rgba(226,112,79,${active?0.5:0.25})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.moveTo(o.x1,o.y1);
      ctx.lineTo(o.x2,o.y2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '24px sans-serif';
      ctx.fillText('🌸', o.x1, o.y1);
      ctx.fillText('🌼', o.x2, o.y2);

      const bx = o.x1 + (o.x2 - o.x1) * flyT;
      const by = o.y1 + (o.y2 - o.y1) * flyT - 22 + (active ? Math.sin(elapsedSec*24)*3 : 0);
      if(active){
        ctx.shadowColor = 'rgba(244,185,66,0.95)';
        ctx.shadowBlur = 10;
      }
      ctx.font = `${active ? 22 : 18}px sans-serif`;
      ctx.save();
      ctx.translate(bx, by);
      ctx.scale(-1, 1); // 左右反転
      ctx.fillText('🐝', 0, 0);
      ctx.restore();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  // --- 物理→音楽パラメータ変換 ---
  const PEND_MIN_P = 0.15, PEND_MAX_P = 1.0;
  function pendulumPeriod(len){
    // T ∝ √L の関係を保ちつつ、画面サイズに対して相対的に0.15〜1.0秒へマッピング
    // （固定の重力定数だと、よくあるドラッグ長ではほぼ全て上限に張り付いてしまうバグがあったため）
    const maxLen = Math.hypot(W, H) * 0.5;
    const t = Math.min(1, len / Math.max(1, maxLen));
    return PEND_MIN_P + (PEND_MAX_P - PEND_MIN_P) * Math.sqrt(t);
  }
  function pendulumTicks(len){
    // 実際の振り子は「鉛直を通過する瞬間」が最も速く、体感的にも"チッ"と鳴るタイミングに合う。
    // 鉛直通過は 1/4周期 → 3/4周期 → 5/4周期 ... (半周期ごと)に発生する。
    const period = pendulumPeriod(len);
    const ticks = [];
    for(let t = period/4; t < MEASURE_DUR; t += period/2) ticks.push(t);
    return { period, ticks };
  }
  // 童謡が作れるように、連続的な周波数ではなくCメジャースケール(2オクターブ)にスナップする
  const FLUTE_SCALE = ['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6'];
  function flutePitch(len){
    const maxLen = Math.max(W,H) * 0.6;
    const t = Math.min(1, len / maxLen); // 0=短い(高い音) 〜 1=長い(低い音)
    const idx = Math.round((1 - t) * (FLUTE_SCALE.length - 1));
    return FLUTE_SCALE[idx];
  }
  function fluteTiming(o){
    // 黄色い再生ヘッドが 始点のx座標 に到達した瞬間に鳴り始め、
    // 終点のx座標 に到達した瞬間に鳴り終わる。
    const t1 = (o.x1 / W) * MEASURE_DUR;
    const t2 = (o.x2 / W) * MEASURE_DUR;
    const startTime = Math.min(t1, t2);
    const duration = Math.max(FLUTE_MIN_DUR, Math.abs(t2 - t1));
    return { startTime, duration };
  }

  // --- 音源 ---
  // 以前は振り子/笛それぞれで単一のPolySynthを共有していたが、
  // 同じ音程（振り子は常にC6、笛も近い音程になりやすい）を同じシンセで複数回・複数時刻に
  // 予約すると、Tone.js内部で同一ピッチのボイスが競合し、後から予約した音が鳴らなくなる
  // 問題があった。オブジェクトごとに専用のシンセを1つずつ持たせることで解決する。
  // --- UIの効果音・揺れ演出 ---
  let uiSynth = null;
  let audioUnlocked = false;
  async function ensureUiSynth(){
    if(!uiSynth){
      uiSynth = new Tone.Synth({
        oscillator:{ type:'sine' },
        envelope:{ attack:0.001, decay:0.08, sustain:0, release:0.05 }
      }).toDestination();
      uiSynth.volume.value = -16;
    }
    if(!audioUnlocked){
      audioUnlocked = true;
      await Tone.start().catch(() => {});
    } else if(Tone.context.state !== 'running'){
      // すでに一度startしていても、環境によってはcontextが再度sus­pendされることがあるため保険をかける
      await Tone.start().catch(() => {});
    }
  }
  // uiSynthは全ボタン共通の単一インスタンスなので、ボタンを連続ですばやく押すと
  // 同じシンセに対してほぼ同時刻（暗黙の"now"）で予約が重なり、Tone.js側が
  // 「前回予約した時刻以下」として例外を投げることがある（下のsafeTriggerAttackRelease
  // と同じ理由・同じ対策）。ここでも直前の予約時刻より必ず後になるよう補正する。
  async function playClickSound(){
    await ensureUiSynth();
    safeTriggerAttackRelease(uiSynth, 'E5', 0.06, Tone.now());
  }
  async function playDenySound(){
    await ensureUiSynth();
    safeTriggerAttackRelease(uiSynth, 'A3', 0.12, Tone.now());
  }
  function shakeStage(){
    stageEl.classList.remove('shake');
    void stageEl.offsetWidth; // 再生を強制的にリスタート
    stageEl.classList.add('shake');
  }
  document.querySelectorAll('button').forEach(b => b.addEventListener('click', playClickSound));

  // タブが一時的にバックグラウンドになる等でsetTimeoutの発火が遅延すると、
  // 計算上のスケジュール時刻(measureStart+t)がすでにTone.now()を過ぎてしまい、
  // 同じシンセに対して「前回予約した時刻以下」の時刻で予約してしまうことがある
  // （Tone.js側が例外を投げ、音が欠落する）。シンセごとに直前の予約時刻を覚えておき、
  // 必ずそれより後の時刻になるよう補正してから予約する。
  const lastNoteTime = new WeakMap(); // シンセ -> 直前に予約した絶対時刻
  function safeTriggerAttackRelease(synth, note, dur, time){
    const prev = lastNoteTime.get(synth) ?? -Infinity;
    const safeTime = Math.max(time, Tone.now() + 0.005, prev + 0.005);
    synth.triggerAttackRelease(note, dur, safeTime);
    lastNoteTime.set(synth, safeTime);
  }

  const synthMap = new Map(); // object参照 -> { trigger: 発音用シンセ, nodes: 破棄対象ノード一覧 }
  function getSynthFor(o){
    let entry = synthMap.get(o);
    if(!entry){
      if(o.type === 'pendulum'){
        // 木琴のような柔らかい「ぽよん」音（高めのMembraneSynth）
        const synth = new Tone.MembraneSynth({
          pitchDecay: 0.035,
          octaves: 1.4,
          oscillator: { type: 'sine' },
          envelope: { attack: 0.001, decay: 0.16, sustain: 0, release: 0.05 }
        }).toDestination();
        synth.volume.value = -10;
        entry = { trigger: synth, nodes: [synth] };
      } else {
        // トイフルート/オカリナ風：サイン波＋軽いビブラートで柔らかく可愛い音に
        const vibrato = new Tone.Vibrato({ frequency: 5.5, depth: 0.15 }).toDestination();
        const synth = new Tone.Synth({
          oscillator: { type: 'sine' },
          envelope: { attack: 0.03, decay: 0.12, sustain: 0.35, release: 0.35 }
        }).connect(vibrato);
        synth.volume.value = -6;
        entry = { trigger: synth, nodes: [synth, vibrato] };
      }
      synthMap.set(o, entry);
    }
    return entry.trigger;
  }
  function disposeSynthsFor(objList){
    objList.forEach(o => {
      const entry = synthMap.get(o);
      if(entry){
        entry.nodes.forEach(n => n.dispose());
        synthMap.delete(o);
      }
    });
  }

  // --- 再生 ---
  // 見た目(アニメーション)と音の両方を「同じ時計」= Tone.jsのAudioContext時刻に揃えることで、
  // performance.now()とAudioContextのクロックのズレによるアニメ⇔音のズレを防ぐ。
  let playStartTone = 0;   // 再生開始時のTone.now()（基準点、以後リセットしない）
  let measureCount = 0;    // 何小節目か

  async function startPlayback(){
    await Tone.start();
    playing = true;
    playToken++;
    const myToken = playToken;
    playBtn.classList.add('playing');
    playBtn.innerHTML = '<span class="icon">⏸</span>とめる';
    statusEl.textContent = 'ながしているよ… ページを めくりながら くりかえすよ。';
    playStartTone = Tone.now();
    measureCount = 0;
    currentPage = 0;
    updatePageIndicator();
    draw();
    scheduleLoop(myToken);
    requestAnimationFrame(renderLoop);
  }

  function scheduleLoop(myToken){
    if(myToken !== playToken || !playing) return;
    if(Tone.context.state !== 'running'){
      // 長時間の負荷などでAudioContextが一時停止してしまった場合に自動で復帰させる
      Tone.start().catch(() => {});
    }
    const measureStart = playStartTone + measureCount * MEASURE_DUR;
    const pageIndex = measureCount % pages.length;

    if(pageIndex !== currentPage){
      animateFlipAway(1); // 再生中は常に「次のページへ」めくる演出
      currentPage = pageIndex;
      updatePageIndicator();
    }

    pages[pageIndex].objects.forEach(o => {
      const len = Math.hypot(o.x2-o.x1, o.y2-o.y1);
      const synth = getSynthFor(o);
      if(o.type === 'pendulum'){
        const { ticks } = pendulumTicks(len);
        ticks.forEach((t, i) => {
          const note = i % 2 === 0 ? 'A5' : 'C6'; // 交互の音程で弾む「ぽよんぽよん」感を出す
          safeTriggerAttackRelease(synth, note, 0.05, measureStart + t);
        });
      } else {
        const note = flutePitch(len);
        const { startTime, duration } = fluteTiming(o);
        safeTriggerAttackRelease(synth, note, duration, measureStart + startTime);
      }
    });

    measureCount++;
    const nextMeasureStart = playStartTone + measureCount * MEASURE_DUR;
    // 次の小節の少し手前で再スケジュール（実時間の遅れをAudioContext時刻基準で補正）
    const delayMs = Math.max(0, (nextMeasureStart - Tone.now() - 0.05) * 1000);
    setTimeout(() => {
      if(playing && myToken === playToken){
        scheduleLoop(myToken);
      }
    }, delayMs);
  }

  function stopPlayback(){
    playing = false;
    playToken++;
    playBtn.classList.remove('playing');
    playBtn.innerHTML = '<span class="icon">▶</span>ならす';
    if(statusEl.textContent.startsWith('ながしているよ')){
      statusEl.textContent = 'とまったよ。';
    }
    updatePageIndicator();
    draw();
  }

  // --- アニメーションループ（音と同じくTone.now()基準で経過時間を計算） ---
  function renderLoop(){
    if(!playing) return;
    const elapsed = (Tone.now() - playStartTone) % MEASURE_DUR;
    draw(elapsed);
    requestAnimationFrame(renderLoop);
  }

  playBtn.onclick = () => {
    if(playing) stopPlayback();
    else startPlayback();
  };

  updatePageIndicator();
  resize();
})();
</script>
</body>
</html>
