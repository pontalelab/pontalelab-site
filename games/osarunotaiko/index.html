<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おさるのたいこ | Pontalelab</title>
<meta name="description" content="おさるといっしょに たいこを たたこう。対象年齢の目安：2〜6歳。">
<meta property="og:title" content="おさるのたいこ | Pontalelab">
<meta property="og:description" content="おさるといっしょに たいこを たたこう。対象年齢の目安：2〜6歳。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pontalelab.com/games/osarunotaiko/">
<meta property="og:image" content="https://pontalelab.com/icons/icon-512.png">

<!-- Home screen icons -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2d6a4f">
<script src="/js/analytics.js" defer></script>

<style>
  :root{
    --sky-top:#FFE8B8;
    --sky-bottom:#FFC978;
    --wood-dark:#7A4A2B;
    --wood-mid:#A8683C;
    --wood-light:#C98A52;
    --fur:#B5764A;
    --fur-dark:#8C5A34;
    --fur-light:#E0AE7C;
    --blush:#FFB3AE;
    --leaf:#5C8A3A;
    --leaf-dark:#436326;
    --leaf-far:#7FA66B;
    --cream:#FFF6E6;
    --ink:#4A2E17;
    --hit-flash:#FFF2C4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    user-select:none;
  }
  #stage{
    position:relative;
    width:100%;
    height:100%;
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 65%, #F2A94E 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
  }

  /* ホーム画面(モード選択) */
  #home-screen{
    position:absolute;
    inset:0;
    z-index:100;
    background:rgba(74,46,23,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity 350ms ease;
  }
  #home-screen.hidden{
    opacity:0;
    pointer-events:none;
  }
  #home-card{
    width:82%;
    max-width:340px;
    background:var(--cream);
    border:4px solid var(--wood-dark);
    border-radius:22px;
    padding:26px 22px;
    box-shadow:0 8px 0 rgba(122,74,43,0.35);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:14px;
  }
  #home-title{
    font-size:22px;
    font-weight:800;
    color:var(--ink);
    text-align:center;
  }
  #home-sub{
    font-size:13px;
    color:var(--ink);
    opacity:0.7;
    text-align:center;
    margin-bottom:4px;
  }
  .mode-btn{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
    padding:14px 16px;
    border:3px solid var(--wood-dark);
    border-radius:14px;
    background:var(--wood-light);
    box-shadow:0 4px 0 rgba(122,74,43,0.35);
    cursor:pointer;
    font-family:inherit;
    text-align:left;
  }
  .mode-btn:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 rgba(122,74,43,0.35);
  }
  .mode-btn-name{
    font-size:17px;
    font-weight:800;
    color:var(--ink);
  }
  .mode-btn-desc{
    font-size:12px;
    color:var(--ink);
    opacity:0.8;
    line-height:1.4;
  }

  /* 背景の木:リズムが揃うスコアに応じて下から上がってくる */
  #bg-trees-far{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:66%;
    z-index:-1;
    pointer-events:none;
    transform: translateY(92%);
    transition: transform 1200ms ease-out;
  }
  #bg-trees-far svg{
    width:100%;
    height:100%;
    display:block;
  }

  #bg-trees{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:52%;
    z-index:0;
    pointer-events:none;
    transform: translateY(88%);
    transition: transform 1000ms ease-out;
  }
  #bg-trees svg{
    width:100%;
    height:100%;
    display:block;
  }

  /* jungle leaf decorations */
  .leaf-deco{
    position:absolute;
    top:0;
    width:100%;
    height:90px;
    pointer-events:none;
  }

  /* header */
  #header{
    width:100%;
    padding:18px 20px 6px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:5;
  }
  #title{
    font-size:20px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:.02em;
  }
  #score-box{
    background:var(--cream);
    border:3px solid var(--wood-dark);
    border-radius:16px;
    padding:6px 16px;
    font-size:18px;
    font-weight:700;
    color:var(--ink);
    min-width:64px;
    text-align:center;
    box-shadow:0 3px 0 rgba(122,74,43,0.3);
  }

  /* 木が上がりきった時の「賑やかモード」演出 */
  #rainbow-overlay{
    position:absolute;
    inset:0;
    z-index:0;
    opacity:0;
    pointer-events:none;
    background:repeating-linear-gradient(120deg,
      #FF3B6B 0%, #FF9F3B 8%, #FFE63B 16%, #5CE85C 24%,
      #3BB8FF 32%, #8A5CFF 40%, #FF3BC7 48%, #FF3B6B 56%);
    background-size:260% 260%;
    transition: opacity 500ms ease;
  }
  #stage.party #rainbow-overlay{
    opacity:0.85;
    animation: rainbowScroll 2.4s linear infinite, rainbowPulse 1.1s ease-in-out infinite;
  }
  @keyframes rainbowScroll{
    0%   { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }
  @keyframes rainbowPulse{
    0%,100% { filter:saturate(1.1) brightness(1); }
    50%     { filter:saturate(1.6) brightness(1.2); }
  }

  /* パーティ中にキラキラ光る星の粒 */
  #party-sparkles{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    opacity:0;
    transition: opacity 400ms ease;
  }
  #stage.party #party-sparkles{ opacity:1; }
  #party-sparkles span{
    position:absolute;
    font-size:30px;
    color:#FFE873;
    text-shadow:0 0 10px rgba(255,255,255,0.9), 0 0 3px rgba(0,0,0,0.15);
    animation: sparkleTwinkle 1.3s ease-in-out infinite;
  }
  @keyframes sparkleTwinkle{
    0%,100% { opacity:0.15; transform:scale(0.6) rotate(0deg); }
    50%     { opacity:1;    transform:scale(1.2) rotate(25deg); }
  }

  #bird-choir{
    position:absolute;
    top:6%;
    left:2%;
    display:flex;
    gap:4px;
    z-index:2;
    pointer-events:none;
    transform: translateX(-140%);
    opacity:0;
    transition: transform 650ms cubic-bezier(.2,.8,.3,1), opacity 500ms ease;
  }
  #choir-branch{
    position:absolute;
    left:-6%;
    right:-14%;
    bottom:8px;
    height:8px;
    background:var(--wood-dark);
    border-radius:6px;
    z-index:-1;
    transform:rotate(-2deg);
  }
  .choir-bird{
    position:relative;
  }
  #bird-choir svg{
    width:44px;
    height:auto;
    display:block;
    transform-origin:50% 100%;
  }
  #stage.party #bird-choir{
    transform: translateX(0);
    opacity:1;
  }
  #stage.party .choir-bird svg{
    animation: choirBounce 560ms ease-in-out infinite;
  }
  #stage.party .choir-bird:nth-child(1) svg{ animation-delay:0ms; }
  #stage.party .choir-bird:nth-child(2) svg{ animation-delay:140ms; }
  #stage.party .choir-bird:nth-child(3) svg{ animation-delay:280ms; }
  @keyframes choirBounce{
    0%,100% { transform: translateY(0) rotate(0deg) scaleY(1); }
    35%     { transform: translateY(-9px) rotate(-8deg) scaleY(1.08); }
    60%     { transform: translateY(-2px) rotate(6deg) scaleY(0.94); }
  }

  .choir-note{
    position:absolute;
    left:50%;
    top:-2px;
    font-size:13px;
    color:#FF8A5B;
    text-shadow:0 1px 0 rgba(255,255,255,0.6);
    opacity:0;
    pointer-events:none;
  }
  #stage.party .choir-note{
    animation: choirNoteFloat 900ms ease-out infinite;
  }
  @keyframes choirNoteFloat{
    0%   { opacity:0; transform:translate(-50%,0) scale(0.6); }
    15%  { opacity:1; }
    100% { opacity:0; transform:translate(-40%,-30px) scale(1.05) rotate(12deg); }
  }

  .dance-monkey{
    position:absolute;
    bottom:16%;
    width:16%;
    max-width:70px;
    z-index:2;
    pointer-events:none;
    opacity:0;
    transition: transform 650ms cubic-bezier(.2,.8,.3,1), opacity 500ms ease;
  }
  .dance-monkey svg{ width:100%; height:auto; display:block; }
  #dance-monkey-left{ left:3%; transform: translateX(-160%); }
  #dance-monkey-right{ right:3%; transform: translateX(160%); }
  #stage.party #dance-monkey-left{ transform: translateX(0) translateY(0); opacity:1; }
  #stage.party #dance-monkey-right{ transform: translateX(0) translateY(0); opacity:1; }
  #stage.party .dance-monkey{
    animation: danceBounce 600ms ease-in-out infinite;
  }
  @keyframes danceBounce{
    0%,100%{ transform: translateX(0) translateY(0); }
    50%    { transform: translateX(0) translateY(-10px); }
  }
  .dance-arm{ transform-box:fill-box; transform-origin:50% 100%; }
  #stage.party .dance-arm-l{ animation: armWaveL 600ms ease-in-out infinite; }
  #stage.party .dance-arm-r{ animation: armWaveR 600ms ease-in-out infinite; }
  @keyframes armWaveL{ 0%,100%{ transform:rotate(-10deg); } 50%{ transform:rotate(18deg); } }
  @keyframes armWaveR{ 0%,100%{ transform:rotate(10deg); } 50%{ transform:rotate(-18deg); } }

  /* 鳥:おさるの右上、木にとまって固定BPMで音符を出す */
  #bird-wrap{
    position:absolute;
    top:2%;
    right:4%;
    width:22%;
    max-width:100px;
    z-index:1;
    pointer-events:none;
  }
  #bird-wrap svg{
    width:100%;
    height:auto;
    display:block;
  }
  .music-note{
    position:absolute;
    font-size:34px;
    font-weight:700;
    color:#FF8A5B;
    text-shadow:0 1px 0 rgba(255,255,255,0.6);
    pointer-events:none;
    z-index:2;
    animation: noteFloat 1100ms ease-out forwards;
  }
  @keyframes noteFloat{
    0%   { opacity:0; transform:translate(0,0) scale(0.6) rotate(-8deg); }
    15%  { opacity:1; transform:translate(-2px,-6px) scale(1) rotate(-4deg); }
    100% { opacity:0; transform:translate(-18px,-46px) scale(1.05) rotate(-14deg); }
  }

  #scene{
    position:relative;
    flex:1;
    width:100%;
    max-width:480px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  svg{ display:block; }

  #monkey-svg{
    position:relative;
    z-index:3;
    width:78%;
    max-width:340px;
    height:auto;
    overflow:visible;
  }

  #face-normal{ opacity:1; transition: opacity 120ms ease; }
  #face-laugh{ opacity:0; transition: opacity 120ms ease; }
  #monkey-svg.laughing #face-normal{ opacity:0; }
  #monkey-svg.laughing #face-laugh{ opacity:1; }

  .arm-l, .arm-r{
    transform-box: fill-box;
    transform-origin: 90% 10%;
  }
  .arm-l{ transform-origin: 10% 10%; }
  .arm-r{ transform-origin: 90% 10%; }

  .stick-l, .stick-r{
    transform-box: fill-box;
    transform-origin: 50% 0%;
  }

  .arm-l.swing{ animation: swingL 340ms cubic-bezier(.25,.1,.25,1) 1; }
  .arm-r.swing{ animation: swingR 340ms cubic-bezier(.25,.1,.25,1) 1; }
  .stick-l.swing{ animation: stickSwingL 340ms cubic-bezier(.2,.05,.2,1) 1; }
  .stick-r.swing{ animation: stickSwingR 340ms cubic-bezier(.2,.05,.2,1) 1; }

  /* 静止角度は水平(バチは親グループでrotate(±90))。
     打撃の瞬間(55%)には「腕の回転+90°(バチ静止傾き)+バチの相対回転」の
     合計が45°になるよう、腕とバチを連動させて振り下ろす
     (振りかぶりで上外側へ、打撃で45°まで振り下ろし、少し戻して静止へ) */
  @keyframes swingL{
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(-18deg); }
    55%  { transform: rotate(18deg); }
    75%  { transform: rotate(8deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes swingR{
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(18deg); }
    55%  { transform: rotate(-18deg); }
    75%  { transform: rotate(-8deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes stickSwingL{
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(-27deg); }
    55%  { transform: rotate(27deg); }
    75%  { transform: rotate(12deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes stickSwingR{
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(27deg); }
    55%  { transform: rotate(-27deg); }
    75%  { transform: rotate(-12deg); }
    100% { transform: rotate(0deg); }
  }

  /* 20回に1回、両手を高く上げて喜ぶポーズ。
     腕もバチも最終的に鉛直上向き(180°)に揃える。
     はみ出し防止のため、
     1) 腕を振り上げる間はバチをワールド座標で下向きのまま打ち消して振れ幅を抑え、
     2) 腕が上がりきってからバチだけを腕に沿わせて真上に揃える
     という2段階にしている(戻りも同じ手順を逆順で実行) */
  .arm-l.celebrate{ animation: celebrateArmL 1000ms ease-in-out 1; }
  .arm-r.celebrate{ animation: celebrateArmR 1000ms ease-in-out 1; }
  .stick-l.celebrate{ animation: celebrateStickL 1000ms ease-in-out 1; }
  .stick-r.celebrate{ animation: celebrateStickR 1000ms ease-in-out 1; }

  @keyframes celebrateArmL{
    0%   { transform: rotate(0deg); }
    35%  { transform: rotate(180deg); }
    55%  { transform: rotate(180deg); }
    75%  { transform: rotate(180deg); }
    90%  { transform: rotate(180deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes celebrateArmR{
    0%   { transform: rotate(0deg); }
    35%  { transform: rotate(-180deg); }
    55%  { transform: rotate(-180deg); }
    75%  { transform: rotate(-180deg); }
    90%  { transform: rotate(-180deg); }
    100% { transform: rotate(0deg); }
  }
  /* 腕の動きを打ち消して「バチのワールド角度」を制御:
     0-35%は下向き(0)を保ったまま腕だけ上げ、35-75%で真上(腕と合計180)へ、
     75-90%で一旦下向きに戻し、90-100%で腕と一緒に元に戻す */
  @keyframes celebrateStickL{
    0%   { transform: rotate(0deg); }
    35%  { transform: rotate(-180deg); }
    55%  { transform: rotate(0deg); }
    75%  { transform: rotate(0deg); }
    90%  { transform: rotate(-180deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes celebrateStickR{
    0%   { transform: rotate(0deg); }
    35%  { transform: rotate(180deg); }
    55%  { transform: rotate(0deg); }
    75%  { transform: rotate(0deg); }
    90%  { transform: rotate(180deg); }
    100% { transform: rotate(0deg); }
  }



  .swoosh{
    opacity:0;
    stroke:var(--fur-light);
    stroke-width:5;
    fill:none;
    stroke-linecap:round;
  }
  .swoosh.swing{
    animation: swooshFade 340ms ease-out 1;
  }
  @keyframes swooshFade{
    0%   { opacity:0; }
    40%  { opacity:0; }
    50%  { opacity:0.85; }
    65%  { opacity:0.4; }
    100% { opacity:0; }
  }

  #drum-wrap{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:-22%;
    z-index:2;
  }
  #drum-svg{
    width:70%;
    max-width:300px;
    height:auto;
  }
  #drum-head{
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 90ms ease-out;
  }
  #drum-head.hit{ transform: scaleY(0.93) translateY(2px); }

  .drum-star{
    position:absolute;
    left:50%;
    top:38%;
    font-size:15px;
    color:#FFD34D;
    text-shadow:0 1px 0 rgba(0,0,0,0.15);
    pointer-events:none;
    z-index:4;
    animation: starBurst 700ms ease-out forwards;
  }
  @keyframes starBurst{
    0%   { opacity:0; transform:translate(-50%,-50%) scale(0.3); }
    18%  { opacity:1; }
    100% { opacity:0; transform:translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,0px))) scale(1.15) rotate(40deg); }
  }

  .ripple{
    position:absolute;
    left:50%;
    top:38%;
    width:40px;
    height:40px;
    margin-left:-20px;
    margin-top:-20px;
    border-radius:50%;
    border:4px solid var(--hit-flash);
    opacity:0;
    pointer-events:none;
  }
  .ripple.play{
    animation: rippleAnim 380ms ease-out forwards;
  }
  @keyframes rippleAnim{
    0%{ opacity:0.9; transform:scale(0.3); }
    100%{ opacity:0; transform:scale(2.6); }
  }

  #ground{
    width:100%;
    height:14%;
    background:linear-gradient(180deg,#C98A52 0%, #A8683C 100%);
    position:relative;
    z-index:1;
    border-top:4px solid var(--wood-dark);
  }

  #footer{
    width:100%;
    padding:10px 20px 22px;
    text-align:center;
    color:var(--ink);
    font-size:13px;
    opacity:0.75;
    z-index:5;
  }

  #tap-hint{
    position:absolute;
    bottom:10px;
    left:0;
    right:0;
    text-align:center;
    font-size:14px;
    color:var(--ink);
    opacity:0.6;
    pointer-events:none;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:0.35; }
    50%{ opacity:0.75; }
  }

  #combo-pop{
    position:absolute;
    font-size:22px;
    font-weight:800;
    color:#FF6B35;
    text-shadow:0 2px 0 #fff8;
    pointer-events:none;
    opacity:0;
    z-index:6;
  }
  #combo-pop.play{
    animation: popUp 550ms ease-out forwards;
  }
  @keyframes popUp{
    0%{ opacity:0; transform:translate(-50%,0) scale(0.6); }
    30%{ opacity:1; transform:translate(-50%,-18px) scale(1.15); }
    100%{ opacity:0; transform:translate(-50%,-46px) scale(1); }
  }
  /* サイトのゲーム一覧への導線。#stage の外側に置くことで、タップが#stageの
     pointerdownリスナー（太鼓の打撃扱い）に伝わらないようにしている。
     上部は#headerのタイトル/スコア表示と重なってしまうため、太鼓（中央）や
     下部中央のヒント文言（#tap-hint、短い中央寄せテキスト）と被らない
     左下の余白に小さく配置する。 */
  #site-back-link{
    position:fixed;
    bottom:10px; left:10px;
    z-index:9999;
    font-size:11px;
    font-weight:700;
    color:var(--ink);
    background:rgba(255,246,230,0.88);
    border:2px solid var(--wood-dark);
    border-radius:20px;
    padding:5px 10px;
    text-decoration:none;
    box-shadow:0 2px 0 rgba(122,74,43,0.3);
  }
</style>
</head>
<body>
<a href="../" id="site-back-link">🎮 ゲームいちらんに もどる</a>
<div id="stage">

  <div id="home-screen">
    <div id="home-card">
      <div id="home-title">おさるのたいこ</div>
      <div id="home-sub">あそびかたを えらんでね</div>
      <button class="mode-btn" id="mode-easy-btn">
        <span class="mode-btn-name">やさしい</span>
        <span class="mode-btn-desc">はやく たたくと うしろの きが あがるよ</span>
      </button>
      <button class="mode-btn" id="mode-rhythm-btn">
        <span class="mode-btn-name">リズム</span>
        <span class="mode-btn-desc">おなじ リズムで たたくと うしろの きが あがるよ</span>
      </button>
    </div>
  </div>

  <div id="rainbow-overlay"></div>

  <div id="party-sparkles">
    <span style="left:8%;top:14%;animation-delay:0ms;">✦</span>
    <span style="left:18%;top:32%;animation-delay:180ms;">★</span>
    <span style="left:30%;top:10%;animation-delay:360ms;">✦</span>

<script>
(function(){
  const stage = document.getElementById('stage');
  const scoreBox = document.getElementById('score-box');
  const monkeySvg = document.getElementById('monkey-svg');
  const armL = document.getElementById('armL');
  const armR = document.getElementById('armR');
  const stickL = document.getElementById('stickL');
  const stickR = document.getElementById('stickR');
  const swooshL = document.getElementById('swooshL');
  const swooshR = document.getElementById('swooshR');
  const drumHead = document.getElementById('drum-head');
  const ripple = document.getElementById('ripple');
  const drumWrap = document.getElementById('drum-wrap');
  const comboPop = document.getElementById('combo-pop');
  const scene = document.getElementById('scene');
  const tapHint = document.getElementById('tap-hint');
  const bgTrees = document.getElementById('bg-trees');
  const bgTreesFar = document.getElementById('bg-trees-far');
  const birdWrap = document.getElementById('bird-wrap');

  const SWING_MS = 340;       // 振りかぶり〜打撃〜戻りの全体時間
  const IMPACT_RATIO = 0.55;  // バチが太鼓に当たるタイミング(アニメ全体に対する割合)
  const IMPACT_MS = Math.round(SWING_MS * IMPACT_RATIO);

  let nextIsLeft = true;
  let score = 0;
  let audioCtx = null;
  let busy = false; // 打撃アニメ中の多重発火を防ぐ

  // --- リズム判定まわり ---
  let lastTapTime = null;
  let treeLevel = 0;          // 0〜100。木の上がり具合
  let partyDropTimer = null;  // 賑やかモードを2秒維持してから解除するためのタイマー
  const TREE_MAX = 100;
  const TARGET_BPM = 100;                        // 「リズム」モード:目標とする一定のリズム
  const TARGET_INTERVAL = 60000 / TARGET_BPM;     // 目標タップ間隔(ms)
  const RHYTHM_TOLERANCE = 0.22;                  // 目標間隔からの許容ズレ(比率)
  const EASY_PACE_MS = 250;                       // 「やさしい」モード:1秒間に4回以上=間隔250ms以下
  let gameMode = null; // 'easy' | 'rhythm'
  let periodicLaughActive = false; // 10回ごとの一瞬の笑い
  let rhythmLaughActive = false;   // リズムキープ中の継続的な笑い
  let rhythmLaughTimer = null;

  function refreshLaughClass(){
    if(periodicLaughActive || rhythmLaughActive){
      monkeySvg.classList.add('laughing');
    } else {
      monkeySvg.classList.remove('laughing');
    }
  }

  function setTreeLevel(level){
    treeLevel = Math.max(0, Math.min(TREE_MAX, level));
    // 0のとき88%(ほぼ隠れる)、100のとき0%(完全に上がりきる)
    const translate = 88 - (treeLevel / TREE_MAX) * 88;
    bgTrees.style.transform = 'translateY(' + translate + '%)';
    // 奥の木はさらに一段高く、少し遅れて追従させる
    const translateFar = 92 - (treeLevel / TREE_MAX) * 92;
    bgTreesFar.style.transform = 'translateY(' + translateFar + '%)';

    // 木が上がりきったら賑やかモード。下がっても2秒間は維持してから解除する
    if(treeLevel >= TREE_MAX){
      clearTimeout(partyDropTimer);
      partyDropTimer = null;
      stage.classList.add('party');
    } else if(stage.classList.contains('party') && !partyDropTimer){
      partyDropTimer = setTimeout(function(){
        stage.classList.remove('party');
        partyDropTimer = null;
      }, 2000);
    }
  }

  // 何もしなくても背景は少しずつ下がっていく(自然減衰)
  setInterval(function(){
    if(treeLevel > 0){
      setTreeLevel(treeLevel - 3);
    }
  }, 400);

  // 鳥が固定BPMで口から音符を出す(プレイヤーが合わせるべき基準リズムを示す)
  const NOTE_CHARS = ['♪', '♫'];
  function spawnBirdNote(){
    const beak = document.getElementById('bird-beak');
    if(!beak || !birdWrap) return;
    const beakRect = beak.getBoundingClientRect();
    const sceneRect = scene.getBoundingClientRect();

    const note = document.createElement('div');
    note.className = 'music-note';
    note.textContent = NOTE_CHARS[Math.floor(Math.random() * NOTE_CHARS.length)];
    note.style.left = (beakRect.left - sceneRect.left) + 'px';
    note.style.top = (beakRect.top + beakRect.height / 2 - sceneRect.top) + 'px';
    scene.appendChild(note);

    setTimeout(function(){
      if(note.parentNode) note.parentNode.removeChild(note);
    }, 1150);
  }
  setInterval(function(){
    if(gameMode === 'rhythm') spawnBirdNote();
  }, TARGET_INTERVAL);

  // ホーム画面:モード選択
  const homeScreen = document.getElementById('home-screen');
  document.getElementById('mode-easy-btn').addEventListener('click', function(e){
    e.stopPropagation();
    gameMode = 'easy';
    homeScreen.classList.add('hidden');
  });
  document.getElementById('mode-rhythm-btn').addEventListener('click', function(e){
    e.stopPropagation();
    gameMode = 'rhythm';
    homeScreen.classList.add('hidden');
  });

  function handleRhythm(now){
    if(lastTapTime === null){
      // 最初のタップはまだ判定できない
      lastTapTime = now;
      return;
    }

    const dt = now - lastTapTime;
    lastTapTime = now;

    // モードごとに判定方法を切り替える
    let onRhythm;
    if(gameMode === 'easy'){
      // やさしい:1秒間に4回以上のペース(間隔250ms以下)で叩けているか
      onRhythm = dt <= EASY_PACE_MS;
    } else {
      // リズム:目標の一定リズム(TARGET_INTERVAL)とどれだけズレているかで判定する
      const deviation = Math.abs(dt - TARGET_INTERVAL) / TARGET_INTERVAL;
      onRhythm = deviation <= RHYTHM_TOLERANCE;
    }

    if(onRhythm){
      setTreeLevel(treeLevel + 14); // 合っている:木が上がる
      spawnDrumStars();
    } else {
      setTreeLevel(treeLevel - 22); // 外れた:木が少しずつ下がる
    }

    // 木が上がりきっていて、かつリズムをキープできている間はおさるが笑い続ける
    if(treeLevel >= TREE_MAX && onRhythm){
      rhythmLaughActive = true;
      refreshLaughClass();
      clearTimeout(rhythmLaughTimer);
      rhythmLaughTimer = setTimeout(function(){
        rhythmLaughActive = false;
        refreshLaughClass();
      }, Math.min(2200, TARGET_INTERVAL * 1.8 + 300));
    } else if(!onRhythm){
      rhythmLaughActive = false;
      clearTimeout(rhythmLaughTimer);
      refreshLaughClass();
    }
  }

  function getAudioCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playDrumSound(){
    try{
      const ctx = getAudioCtx();
      const now = ctx.currentTime;

      // low thump (membrane)
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.12);
      gain.gain.setValueAtTime(0.9, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.26);

      // click transient (stick hit)
      const bufferSize = ctx.sampleRate * 0.03;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){
        data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.35, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 2200;
      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + 0.05);
    }catch(e){ /* audio not available, ignore */ }
  }

  function vibrate(){
    if(navigator.vibrate){ navigator.vibrate(15); }
  }

  function showRipple(){
    ripple.classList.remove('play');
    void ripple.offsetWidth;
    ripple.classList.add('play');
  }

  // テンポが合った時に太鼓から星を飛ばす。パーティ状態では数を増やす
  function spawnDrumStars(){
    const count = stage.classList.contains('party') ? 9 : 3;
    for(let i = 0; i < count; i++){
      const star = document.createElement('div');
      star.className = 'drum-star';
      star.textContent = '★';
      const angle = Math.random() * Math.PI * 2;
      const dist = 34 + Math.random() * 46;
      star.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      star.style.setProperty('--dy', (Math.sin(angle) * dist - 24) + 'px');
      star.style.fontSize = (12 + Math.random() * 10) + 'px';
      star.style.animationDelay = (Math.random() * 80) + 'ms';
      drumWrap.appendChild(star);
      setTimeout(function(){
        if(star.parentNode) star.parentNode.removeChild(star);
      }, 820);
    }
  }

  function showCombo(){
    if(score > 0 && score % 10 === 0){
      comboPop.textContent = score + 'かい つづいたよ！';
      comboPop.classList.remove('play');
      void comboPop.offsetWidth;
      comboPop.classList.add('play');

      // 10回に1回、おさるが笑う
      periodicLaughActive = true;
      refreshLaughClass();
      setTimeout(function(){
        periodicLaughActive = false;
        refreshLaughClass();
      }, 650);

      // 20回に1回、両手を上げて喜ぶ
      if(score % 20 === 0){
        setTimeout(function(){
          armL.classList.add('celebrate');
          armR.classList.add('celebrate');
          stickL.classList.add('celebrate');
          stickR.classList.add('celebrate');
          setTimeout(function(){
            armL.classList.remove('celebrate');
            armR.classList.remove('celebrate');
            stickL.classList.remove('celebrate');
            stickR.classList.remove('celebrate');
          }, 1020);
        }, SWING_MS + 30);
      }
    }
  }

  function restartAnim(el){
    el.classList.remove('swing');
    void el.offsetWidth; // reflow でアニメーションを強制的に最初から再生
    el.classList.add('swing');
  }

  function hit(){
    if(tapHint){ tapHint.style.display = 'none'; }

    handleRhythm(performance.now());

    const arm = nextIsLeft ? armL : armR;
    const stick = nextIsLeft ? stickL : stickR;
    const swoosh = nextIsLeft ? swooshL : swooshR;

    // 腕とバチを連動させて振り下ろし、太鼓を打撃するアニメーションを再生
    restartAnim(arm);
    restartAnim(stick);
    restartAnim(swoosh);

    setTimeout(function(){
      arm.classList.remove('swing');
      stick.classList.remove('swing');
      swoosh.classList.remove('swing');
    }, SWING_MS + 20);

    // バチが実際に太鼓に当たる瞬間に合わせて演出を発火
    setTimeout(function(){
      drumHead.classList.add('hit');
      showRipple();
      playDrumSound();
      vibrate();
      setTimeout(function(){ drumHead.classList.remove('hit'); }, 110);
    }, IMPACT_MS);

    score += 1;
    scoreBox.innerHTML = score + '<span style="font-size:12px;font-weight:600;"> かい</span>';
    showCombo();

    nextIsLeft = !nextIsLeft;
  }

  stage.addEventListener('pointerdown', function(e){
    // モード選択ボタンはstageの内側にあるため、ボタンを押した瞬間のpointerdownが
    // stageまでバブリングしてしまい、遊び始める前に「たいこを1回叩いた」扱いに
    // なってしまう（スコアが1から始まる・音や振動が鳴る）不具合があった。
    // モードを選ぶまではhit()を無視することで防ぐ。
    if(gameMode === null) return;
    hit();
  }, {passive:true});

})();
</script>
</body>
