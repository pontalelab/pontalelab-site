name: Build pokopokosea (うみのひらがな)

on:
  push:
    branches: [main]
    paths:
      - 'games/pokopokosea/src/**'
      - 'games/pokopokosea/public/**'
      - 'games/pokopokosea/index.dev.html'
      - 'games/pokopokosea/package.json'
      - 'games/pokopokosea/package-lock.json'
      - 'games/pokopokosea/vite.config.ts'
      - 'games/pokopokosea/tsconfig*.json'
      - '.github/workflows/build-pokopokosea.yml'
  pull_request:
    branches: [main]
    paths:
      - 'games/pokopokosea/src/**'
      - 'games/pokopokosea/public/**'
      - 'games/pokopokosea/index.dev.html'
      - 'games/pokopokosea/package.json'
      - 'games/pokopokosea/package-lock.json'
      - 'games/pokopokosea/vite.config.ts'
      - 'games/pokopokosea/tsconfig*.json'
      - '.github/workflows/build-pokopokosea.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-pokopokosea-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: games/pokopokosea/package-lock.json

      - name: Restore source index.html
        # index.dev.html は常に正しいビルド入力（/src/main.tsx を参照する）。
        # 直前のビルドで index.html が成果物で上書きされていても、ここで必ず復元する。
        run: cp games/pokopokosea/index.dev.html games/pokopokosea/index.html

      - name: Install dependencies
        working-directory: games/pokopokosea
        run: npm ci

      - name: Type check & build
        working-directory: games/pokopokosea
        run: npm run build

      - name: Sync build output into serving directory
        # pull_request では検証のみ（ビルドが通るかどうかのCIチェック）。
        # main への push のときだけ、実際に配信ディレクトリへ反映する。
        if: github.event_name == 'push'
        run: |
          rsync -a --delete \
            --exclude='src' \
            --exclude='public' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='vite.config.ts' \
            --exclude='tsconfig.json' \
            --exclude='index.dev.html' \
            --exclude='.gitignore' \
            games/pokopokosea/dist/ games/pokopokosea/

      - name: Commit and push build output
        if: github.event_name == 'push'
        run: |
          git config user.name "pontalelab-bot"
          git config user.email "actions@github.com"
          git add games/pokopokosea
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "chore: うみのひらがなを自動ビルド・デプロイ"
            git push
          fi
